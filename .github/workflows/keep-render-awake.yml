name: Keep Render API awake

on:
  schedule:
    # Every 10 minutes (UTC). Render Free sleeps after ~15 min idle.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        run: |
          set -euo pipefail
          URL="https://pharmacy-budget-tracker.onrender.com/health"
          echo "Pinging $URL"
          for i in 1 2 3; do
            if curl -fsS --max-time 90 "$URL"; then
              echo
              echo "OK (attempt $i)"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          echo "All attempts failed"
          exit 1
